name: Dashboard sync

# Free scheduler for the hosted BFA Admin dashboard: calls its sync endpoint every hour.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DASHBOARD_URL  e.g. https://bfa-admin.vercel.app
#   CRON_SECRET    the same value as CRON_SECRET in the hosting environment
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger synchronisation
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DASHBOARD_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "${DASHBOARD_URL%/}/api/cron/sync" --max-time 320)
          cat response.json; echo
          # 409 = a sync was already running, which is fine.
          if [ "$status" != "200" ] && [ "$status" != "409" ]; then
            echo "Sync request failed with HTTP $status"
            exit 1
          fi
