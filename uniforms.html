<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFA Kit Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one narrow centered column; every screen asks one thing with big buttons. */
  :root{
    --paper:#f3f4f7; --card:#ffffff; --sunk:#eceef3; --ink:#11131b; --muted:#5f6577; --line:#dfe2e9;
    --accent:#d0202f; --ok:#14804a; --ok-bg:#e3f4ea; --warn:#9a6400; --warn-bg:#fbf0d9;
    --kit-red:#d0202f; --kit-black:#15161a; --kit-white:#ffffff;
    --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
    --f-body:'Barlow',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(17,19,27,.06),0 6px 20px rgba(17,19,27,.06);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#0e1015; --card:#171a22; --sunk:#1f232d; --ink:#eef0f5; --muted:#9aa0b2; --line:#2a2f3b;
    --accent:#ff4655; --ok:#45c983; --ok-bg:#15301f; --warn:#e8b54a; --warn-bg:#33270e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark; } }
  :root[data-theme="dark"]{
    --paper:#0e1015; --card:#171a22; --sunk:#1f232d; --ink:#eef0f5; --muted:#9aa0b2; --line:#2a2f3b;
    --accent:#ff4655; --ok:#45c983; --ok-bg:#15301f; --warn:#e8b54a; --warn-bg:#33270e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark; }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--f-body);background:var(--paper);color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;}
  button,input{font:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .hidden{display:none!important;}
  .tnum{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}

  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .top img{width:40px;height:40px;object-fit:contain;}
  .top .t b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-transform:uppercase;line-height:1;}
  .top .t span{font-size:.8rem;color:var(--muted);font-weight:600;}
  .top .sp{flex:1;}
  .small-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:600;}

  .step{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
  h1{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;text-transform:uppercase;margin:0 0 20px;text-wrap:balance;}
  .stack{display:flex;flex-direction:column;gap:12px;}

  .big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:68px;padding:14px 18px;border-radius:16px;
    border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em;}
  .big:hover{border-color:var(--ink);}
  .big:active{transform:scale(.985);}
  .big.main{background:var(--accent);border-color:var(--accent);color:#fff;min-height:96px;font-size:2rem;}
  .big.dark{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .big[disabled]{opacity:.4;cursor:not-allowed;}
  .big .sub{display:block;font-family:var(--f-body);font-size:.9rem;font-weight:600;text-transform:none;letter-spacing:0;opacity:.85;}
  .big.col{flex-direction:column;gap:2px;}
  .k-red{background:var(--kit-red);border-color:var(--kit-red);color:#fff;}
  .k-black{background:var(--kit-black);border-color:var(--kit-black);color:#fff;}
  .k-white{background:var(--kit-white);border-color:#c9ccd5;color:#11131b;}
  .big.k-red:hover,.big.k-black:hover{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);}
  .sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  .sizes .big{min-height:72px;padding:8px 4px;font-size:1.7rem;}
  .label{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px;}

  .back{align-self:flex-start;margin-top:22px;border:0;background:transparent;font-weight:700;font-size:1rem;color:var(--muted);padding:10px 4px;}
  .back:hover{color:var(--ink);}

  .search{width:100%;padding:16px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:1.15rem;}
  .search:focus{outline:none;border-color:var(--ink);}
  .players{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);}
  .prow:hover{border-color:var(--ink);}
  .prow .n{font-weight:700;font-size:1.1rem;}
  .prow .m{font-size:.85rem;color:var(--muted);}
  .prow .i{flex:1;min-width:0;}
  .tag{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-family:var(--f-display);font-weight:800;font-size:2rem;text-transform:uppercase;letter-spacing:.04em;}
  .field input:focus{outline:none;border-color:var(--ink);}
  .field input#f-num{text-align:center;}
  .err{color:var(--accent);font-weight:700;min-height:1.3em;}
  .warn{color:var(--warn);background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-weight:600;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .who{display:flex;align-items:center;gap:12px;}
  .who .nm{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1;}
  .who .bp{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin-left:auto;white-space:nowrap;}
  .line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .line .sw{width:26px;height:26px;border-radius:8px;border:1px solid #c9ccd5;flex-shrink:0;}
  .line .w{flex:1;font-weight:700;font-size:1.1rem;}
  .qty{display:flex;align-items:center;gap:4px;}
  .qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:1.4rem;font-weight:700;}
  .qty span{min-width:30px;text-align:center;font-weight:800;font-size:1.2rem;}
  .total{display:flex;align-items:baseline;justify-content:space-between;padding-top:12px;border-top:2px solid var(--ink);margin-top:4px;}
  .total b{font-family:var(--f-display);font-weight:800;font-size:2.2rem;}
  .paid-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .paid-row .big{min-height:58px;font-size:1.25rem;}
  .paid-row .on-paid{background:var(--ok);border-color:var(--ok);color:#fff;}
  .paid-row .on-unpaid{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .done{text-align:center;padding:30px 0 10px;}
  .done .tick{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:2.8rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}

  .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px;}
  .fig{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .fig b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;}
  .fig span{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .sale{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
  .sale:first-child{border-top:0;}
  .sale .i{flex:1;min-width:0;}
  .sale .n{font-weight:700;}
  .sale .d{font-size:.88rem;color:var(--muted);}
  .pill{border:0;border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:700;white-space:nowrap;}
  .pill.y{background:var(--ok-bg);color:var(--ok);} .pill.n{background:var(--warn-bg);color:var(--warn);}
  .x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:4px 6px;}
  .closed{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:14px 16px;font-weight:700;text-align:center;}
  .date{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-weight:600;}

  .gate-msg{margin:auto 0;display:flex;flex-direction:column;gap:14px;}
  .pin{width:100%;text-align:center;padding:16px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-family:var(--f-display);font-size:2.2rem;letter-spacing:.5em;}
  .pin:focus{outline:none;border-color:var(--ink);}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .roles .big{font-size:1.15rem;min-height:60px;}
  .roles .wide{grid-column:1/-1;}

  .modal{position:fixed;inset:0;background:rgba(10,12,18,.55);display:none;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-left,0px));z-index:50;}
  .modal.show{display:flex;}
  .modal .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;}
  #toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="logo.png" alt="BFA">
    <div class="t"><b>Kit shop</b><span id="top-sub">Beirut Football Academy</span></div>
    <span class="sp"></span>
    <button class="small-btn" id="theme-btn" title="Light / dark">◐</button>
    <button class="small-btn hidden" id="logout-btn">Log out</button>
  </div>
  <div id="screen" class="stack"><p class="muted" id="loading-text">Loading players…</p></div>
</div>
<div class="modal" id="modal"><div class="card" id="modal-body"></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBGOrBYpLtl4fqb-JFJNHWZheQVkO9VpYA",
    authDomain: "bfa-sc-tracker.firebaseapp.com",
    databaseURL: "https://bfa-sc-tracker-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bfa-sc-tracker", storageBucket: "bfa-sc-tracker.firebasestorage.app",
    messagingSenderId: "337221107402", appId: "1:337221107402:web:90be943b8cfec13db03e33"
  };
  const db = getDatabase(initializeApp(firebaseConfig));
  // The roster (branches, teams, players, PINs) belongs to the academy app and is only READ here.
  // Kit-shop data lives under its own root so this page can never overwrite roster data.
  const ROSTER_ROOT = "bfaTeamsState", ROOT = "bfaUniformsState";
  const uniRef = ref(db, ROOT);
  function wSet(path,val){ set(ref(db, ROOT+"/"+path), val).catch(e=>{console.error("write",path,e); toast("Not saved — check your connection");}); }
  function wRemove(path){ remove(ref(db, ROOT+"/"+path)).catch(e=>console.error("remove",path,e)); }
  function wMulti(u){ update(uniRef, u).catch(e=>{console.error("multi-write",e); toast("Not saved — check your connection");}); }
  const SESSION_KEY="bfaTeamsSession_v1", THEME_KEY="bfaTeamsTheme";

  const COLORS=[{id:"red",label:"Red"},{id:"black",label:"Black"},{id:"white",label:"White"}];
  const KID_SIZES=["6","8","10","12"], ADULT_SIZES=["XS","S","M","L","XL","XXL","XXXL"], SIZES=[...KID_SIZES,...ADULT_SIZES];
  const NICK_MAX=12;

  // ===== State =====
  let roster={branches:[],teams:[],players:[],auth:{setupDone:false,adminPin:"",branchPins:{}}};
  let uni={settings:{collection:"",price:0},orders:[],closings:{}};
  let rosterLoaded=false, uniLoaded=false, booted=false, session=null;
  let screen="login";     // login | pin | home | player | print | color | size | basket | done | day
  let pendingRole=null, search="", sale=null, pickColor=null, lastSaved=null, dayDate=todayStr(), confirmClose=false, confirmDel=null;

  function toArray(x){ if(Array.isArray(x))return x; if(x&&typeof x==="object")return Object.values(x); return []; }
  function normOrder(o){ if(!Array.isArray(o.items)) o.items=o.color?[{color:o.color,size:o.size,qty:Number(o.qty)||1}]:toArray(o.items); return o; }
  onValue(ref(db, ROSTER_ROOT), snap=>{ const r=snap.val()||{};
    roster={ branches:toArray(r.branches), teams:toArray(r.teams), players:toArray(r.players).filter(p=>p&&p.id&&p.name), auth:r.auth||{setupDone:false} };
    if(!roster.auth.branchPins)roster.auth.branchPins={};
    rosterLoaded=true; onData(); }, onFail);
  onValue(uniRef, snap=>{ const u=snap.val()||{};
    uni={ settings:{collection:"",price:0,...(u.settings||{})}, orders:toArray(u.orders).filter(o=>o&&o.id).map(normOrder), closings:u.closings||{} };
    uniLoaded=true; onData(); }, onFail);
  function onFail(err){ console.error(err); const el=document.getElementById("loading-text"); if(el)el.textContent="Could not connect. Check your internet and reload."; }
  function onData(){ if(!rosterLoaded||!uniLoaded)return;
    if(!booted){ booted=true; const s=getSession(); if(isValidSession(s)){ session=s; screen="home"; } render(); return; }
    if(session&&!isValidSession(session)){ logout(); return; }
    // Live updates only refresh screens that show shared data, so typing is never interrupted.
    if(["home","day","login","player"].includes(screen)) render(); }

  // ===== Helpers =====
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function todayStr(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  function fmtDate(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}); }
  function fmtTime(ts){ return ts?new Date(ts).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}):""; }
  function money(n){ return "$"+(Math.round((Number(n)||0)*100)/100).toLocaleString(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function isAdmin(){ return !!session&&session.role==="admin"; }
  function myBranch(){ return session&&session.role==="branch"?session.branchId:null; }
  function branchName(id){ const b=roster.branches.find(b=>b.id===id); return b?b.name:"—"; }
  function teamName(id){ const t=roster.teams.find(t=>t.id===id); return t?t.name:""; }
  function player(id){ return roster.players.find(p=>p.id===id)||null; }
  function colorLabel(id){ const c=COLORS.find(c=>c.id===id); return c?c.label:id; }
  function inScope(bid){ return isAdmin()||bid===myBranch(); }
  function scopeIds(){ return isAdmin()?roster.branches.map(b=>b.id):[myBranch()]; }
  function pieces(o){ return o.items.reduce((s,i)=>s+i.qty,0); }
  function orderTotal(o){ return pieces(o)*(Number(o.price)||0); }
  function closing(date,bid){ return (uni.closings[date]&&uni.closings[date][bid])||null; }
  function itemsText(items){ return items.map(i=>`${i.qty>1?i.qty+"× ":""}${colorLabel(i.color)} ${i.size}`).join(", "); }
  function sortItems(items){ return items.slice().sort((a,b)=>COLORS.findIndex(c=>c.id===a.color)-COLORS.findIndex(c=>c.id===b.color)||SIZES.indexOf(a.size)-SIZES.indexOf(b.size)); }
  function back(to){ return `<button class="back" onclick="app.to('${to}')">← Back</button>`; }

  // ===== Login (same PINs and session as the academy app) =====
  function getSession(){ try{return JSON.parse(sessionStorage.getItem(SESSION_KEY));}catch(e){return null;} }
  function isValidSession(s){ if(!s)return false; if(s.role==="admin")return true; if(s.role==="branch")return roster.branches.some(b=>b.id===s.branchId); return false; }
  function applyTheme(t){ if(t)document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
  try{ const t=localStorage.getItem(THEME_KEY); if(t)applyTheme(t); }catch(e){}
  document.getElementById("theme-btn").addEventListener("click",()=>{ const cur=document.documentElement.getAttribute("data-theme"); const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches; const next=dark?"light":"dark"; applyTheme(next); try{localStorage.setItem(THEME_KEY,next);}catch(e){} });
  document.getElementById("logout-btn").addEventListener("click",()=>logout());
  function logout(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} session=null; sale=null; screen="login"; closeModal(); render(); }
  function chooseRole(role,bid){ pendingRole=role==="branch"?{role:"branch",branchId:bid}:{role:"admin"}; screen="pin"; render(); }
  function submitPin(){ const pin=document.getElementById("f-pin").value.trim();
    const ok=pendingRole.role==="admin"?(pin&&pin===roster.auth.adminPin):(pin&&pin===roster.auth.branchPins[pendingRole.branchId]);
    if(!ok){ document.getElementById("f-err").textContent="Wrong PIN. Try again."; return; }
    try{ sessionStorage.setItem(SESSION_KEY,JSON.stringify(pendingRole)); }catch(e){}
    session=pendingRole; screen="home"; render();
    if(isAdmin()&&!uni.settings.collection) openSettings(); }

  // ===== Screens =====
  function to(s){ screen=s; confirmClose=false; confirmDel=null; render(); }
  function render(){
    const el=document.getElementById("screen");
    document.getElementById("logout-btn").classList.toggle("hidden",!session);
    document.getElementById("top-sub").textContent=session?(isAdmin()?"Admin":branchName(myBranch()))+(uni.settings.collection?" · "+uni.settings.collection:""):"Beirut Football Academy";
    if(!roster.auth||!roster.auth.setupDone){ el.innerHTML=`<div class="gate-msg"><h1>Not set up yet</h1><p class="muted">Finish setup in the academy app first.</p><a class="big main" href="teams.html" style="text-decoration:none;">Open academy app</a></div>`; return; }
    if(!session&&screen!=="pin") screen="login";
    const html={ login:loginHtml, pin:pinHtml, home:homeHtml, player:playerHtml, print:printHtml, color:colorHtml, size:sizeHtml, basket:basketHtml, done:doneHtml, day:dayHtml }[screen];
    el.innerHTML=html();
    const f=el.querySelector("[autofocus]"); if(f){ f.focus(); if(f.setSelectionRange&&f.type!=="number"){ const n=f.value.length; try{f.setSelectionRange(n,n);}catch(e){} } }
    if(screen!==render.last){ window.scrollTo(0,0); render.last=screen; } }

  function loginHtml(){ return `<h1>Who's selling?</h1>
    <div class="roles">${roster.branches.map(b=>`<button class="big" onclick="app.chooseRole('branch','${b.id}')">${esc(b.name)}</button>`).join("")}
    <button class="big dark wide" onclick="app.chooseRole('admin')">Admin</button></div>`; }
  function pinHtml(){ return `<div class="step">${pendingRole.role==="admin"?"Admin":esc(branchName(pendingRole.branchId))}</div><h1>Enter your PIN</h1>
    <input class="pin" id="f-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus oninput="this.value=this.value.replace(/\\D/g,'')" onkeydown="if(event.key==='Enter')app.submitPin()">
    <div class="err" id="f-err"></div>
    <button class="big main" onclick="app.submitPin()">Sign in</button>${back("login")}`; }

  function homeHtml(){
    const today=uni.orders.filter(o=>o.date===todayStr()&&inScope(o.branchId));
    const shirts=today.reduce((s,o)=>s+pieces(o),0);
    return `<h1>Hi! What do you want to do?</h1>
      ${!uni.settings.collection?`<div class="warn">${isAdmin()?"Set the kit name and price first (Kit settings below).":"The admin hasn't set the kit name and price yet."}</div>`:""}
      <button class="big main col" onclick="app.newSale()" ${uni.settings.collection?"":"disabled"}>New sale<span class="sub">Kit ${money(uni.settings.price)} each</span></button>
      <button class="big col" onclick="app.openDay()">End of day<span class="sub">Today: ${today.length} kid${today.length===1?"":"s"} · ${shirts} shirt${shirts===1?"":"s"}</span></button>
      ${isAdmin()?`<button class="big" style="font-size:1.2rem;min-height:56px;" onclick="app.openSettings()">Kit settings</button>`:""}`; }

  // Step 1: player
  function newSale(){ sale={ playerId:null, number:"", nickname:"", items:[], paid:null }; search=""; to("player"); }
  function playerHtml(){
    const q=search.trim().toLowerCase();
    const list=q?roster.players.filter(p=>inScope(p.branchId)&&p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,30):[];
    const bought=new Set(uni.orders.filter(o=>o.collection===uni.settings.collection).map(o=>o.playerId));
    return `<div class="step">Step 1 of 4</div><h1>Which player?</h1>
      <input class="search" id="f-search" type="search" placeholder="Type the player's name" value="${esc(search)}" autocomplete="off" autofocus oninput="app.setSearch(this.value)">
      <div class="players" id="f-players">${playerRows(list,bought,q)}</div>${back("home")}`; }
  function playerRows(list,bought,q){
    if(!q)return `<p class="muted">Start typing a name.</p>`;
    if(!list.length)return `<p class="muted">No player found. Players are added in the academy app.</p>`;
    return list.map(p=>`<button class="prow" onclick="app.pickPlayer('${p.id}')"><span class="i"><span class="n">${esc(p.name)}</span><br><span class="m">${esc([teamName(p.teamId),isAdmin()?branchName(p.branchId):""].filter(Boolean).join(" · "))}</span></span>${bought.has(p.id)?`<span class="tag">Has kit</span>`:""}</button>`).join(""); }
  function setSearch(v){ search=v; const q=v.trim().toLowerCase();
    const list=q?roster.players.filter(p=>inScope(p.branchId)&&p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,30):[];
    const bought=new Set(uni.orders.filter(o=>o.collection===uni.settings.collection).map(o=>o.playerId));
    document.getElementById("f-players").innerHTML=playerRows(list,bought,q); }
  function pickPlayer(pid){ sale.playerId=pid;
    const prev=uni.orders.filter(o=>o.playerId===pid&&o.collection===uni.settings.collection).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
    if(prev&&!sale.number){ sale.number=String(prev.number); sale.nickname=prev.nickname; }
    to("print"); }

  // Step 2: number + name
  function printHtml(){ const p=player(sale.playerId);
    return `<div class="step">Step 2 of 4 · ${esc(p?p.name:"")}</div><h1>Number and name on the back</h1>
      <div class="field"><label class="label" for="f-num">Number</label><input id="f-num" inputmode="numeric" maxlength="2" value="${esc(sale.number)}" placeholder="10" autofocus oninput="this.value=this.value.replace(/\\D/g,'');app.checkNum(this.value)"></div>
      <div id="f-clash">${clashHtml(sale.number)}</div>
      <div class="field"><label class="label" for="f-nick">Name on the back</label><input id="f-nick" maxlength="${NICK_MAX}" value="${esc(sale.nickname)}" placeholder="NAME" onkeydown="if(event.key==='Enter')app.savePrint()"></div>
      <div class="err" id="f-err"></div>
      <button class="big main" onclick="app.savePrint()">Next</button>${back("player")}`; }
  // Another kid on the same team already has this number for the current kit.
  function clashHtml(num){ const p=player(sale&&sale.playerId); if(!p||!p.teamId||num==="")return "";
    const names=[...new Set(uni.orders.filter(o=>o.collection===uni.settings.collection&&o.playerId!==p.id&&o.teamId===p.teamId&&Number(o.number)===Number(num)).map(o=>o.playerName))];
    return names.length?`<div class="warn">Number ${esc(Number(num))} is already taken on ${esc(teamName(p.teamId))} by ${names.map(esc).join(", ")}.</div>`:""; }
  function checkNum(v){ document.getElementById("f-clash").innerHTML=clashHtml(v); }
  function savePrint(){ const num=document.getElementById("f-num").value.trim(), nick=document.getElementById("f-nick").value.trim().toUpperCase(), err=document.getElementById("f-err");
    if(!/^\d{1,2}$/.test(num)){ err.textContent="Type the shirt number (0–99)."; return; }
    if(!nick){ err.textContent="Type the name for the back."; return; }
    if(!/^[\p{L}\p{N} .'\-]+$/u.test(nick)){ err.textContent="Use only letters, numbers, spaces, dots, dashes or apostrophes."; return; }
    sale.number=num; sale.nickname=nick; to(sale.items.length?"basket":"color"); }

  // Step 3: color
  function colorHtml(){ return `<div class="step">Step 3 of 4</div><h1>Which color?</h1>
    ${COLORS.map(c=>`<button class="big k-${c.id}" onclick="app.pickColor('${c.id}')">${c.label}</button>`).join("")}
    ${back(sale.items.length?"basket":"print")}`; }
  function choose(c){ pickColor=c; to("size"); }

  // Step 4: size
  function sizeHtml(){ const b=s=>`<button class="big" onclick="app.pickSize('${s}')">${esc(s)}</button>`;
    return `<div class="step">Step 4 of 4 · ${esc(colorLabel(pickColor))}</div><h1>Which size?</h1>
      <div class="label">Kids</div><div class="sizes">${KID_SIZES.map(b).join("")}</div>
      <div class="label">Adults</div><div class="sizes">${ADULT_SIZES.map(b).join("")}</div>${back("color")}`; }
  function pickSize(s){ const it=sale.items.find(i=>i.color===pickColor&&i.size===s); if(it)it.qty++; else sale.items.push({color:pickColor,size:s,qty:1}); to("basket"); }

  // Check the order
  function basketHtml(){ const p=player(sale.playerId); const n=sale.items.reduce((s,i)=>s+i.qty,0); const price=Number(uni.settings.price)||0;
    return `<h1>Check the order</h1>
      <div class="card">
        <div class="who"><span class="nm">${esc(p?p.name:"")}</span><span class="bp">#${esc(sale.number)} ${esc(sale.nickname)}</span></div>
        <div style="margin-top:12px;">${sortItems(sale.items).map(i=>`<div class="line"><span class="sw k-${i.color}"></span><span class="w">${esc(colorLabel(i.color))} · ${esc(i.size)}</span>
          <span class="qty"><button onclick="app.bump('${i.color}','${i.size}',-1)" aria-label="One less">−</button><span class="tnum">${i.qty}</span><button onclick="app.bump('${i.color}','${i.size}',1)" aria-label="One more">+</button></span></div>`).join("")}</div>
        <div class="total"><span class="muted">${n} shirt${n===1?"":"s"} × ${money(price)}</span><b class="tnum">${money(n*price)}</b></div>
      </div>
      <button class="big" onclick="app.to('color')">+ Add another shirt</button>
      <div class="label">Has the parent paid?</div>
      <div class="paid-row"><button class="big ${sale.paid===true?"on-paid":""}" onclick="app.setPaid(true)">Paid</button><button class="big ${sale.paid===false?"on-unpaid":""}" onclick="app.setPaid(false)">Not yet</button></div>
      <div class="err" id="f-err"></div>
      <button class="big main" onclick="app.saveSale()" ${n?"":"disabled"}>Save sale</button>
      <div style="display:flex;justify-content:space-between;">${back("print").replace("← Back","← Change number / name")}<button class="back" onclick="app.cancelSale()">Cancel sale</button></div>`; }
  function bump(c,s,d){ const it=sale.items.find(i=>i.color===c&&i.size===s); if(!it)return; it.qty+=d; if(it.qty<=0)sale.items=sale.items.filter(i=>i!==it); if(!sale.items.length){ to("color"); return; } render(); }
  function setPaid(v){ sale.paid=v; render(); }
  function cancelSale(){ sale=null; to("home"); }
  function saveSale(){ const err=document.getElementById("f-err"); const p=player(sale.playerId);
    if(sale.paid===null){ err.textContent="Tap Paid or Not yet."; return; }
    if(!p){ err.textContent="This player is no longer in the roster."; return; }
    const date=todayStr();
    if(closing(date,p.branchId)){ err.textContent=`${branchName(p.branchId)} already closed today. Ask the admin to reopen the day.`; return; }
    const o={ id:uid(), date, createdAt:Date.now(), playerId:p.id, playerName:p.name, branchId:p.branchId, teamId:p.teamId||null, teamName:teamName(p.teamId),
      number:Number(sale.number), nickname:sale.nickname, items:sortItems(sale.items), price:Number(uni.settings.price)||0, paid:sale.paid,
      collection:uni.settings.collection, by:isAdmin()?"Admin":branchName(myBranch()) };
    uni.orders.push(o); wSet("orders/"+o.id,o); lastSaved=o; sale=null; to("done"); }
  function doneHtml(){ const o=lastSaved;
    return `<div class="done"><div class="tick">✓</div><h1>Saved!</h1>
      <p class="muted" style="font-size:1.05rem;">${esc(o.playerName)} · #${esc(o.number)} ${esc(o.nickname)}<br>${esc(itemsText(o.items))}<br><b>${money(orderTotal(o))}</b> · ${o.paid?"paid":"not paid yet"}</p></div>
      <button class="big main" onclick="app.newSale()">Next sale</button>
      <button class="big" onclick="app.to('home')">Done for now</button>`; }

  // ===== End of day =====
  function openDay(){ dayDate=todayStr(); to("day"); }
  function dayHtml(){
    const list=uni.orders.filter(o=>o.date===dayDate&&inScope(o.branchId)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const shirts=list.reduce((s,o)=>s+pieces(o),0), sales=list.reduce((s,o)=>s+orderTotal(o),0), cash=list.filter(o=>o.paid).reduce((s,o)=>s+orderTotal(o),0);
    const open=scopeIds().filter(b=>!closing(dayDate,b)), isClosed=!open.length, unpaid=list.filter(o=>!o.paid).length;
    let action;
    if(isClosed) action=`<div class="closed">✓ This day is closed</div>
      ${list.length?`<button class="big" onclick="app.download()">Download Excel again</button>`:""}
      ${isAdmin()?`<button class="big" style="font-size:1.1rem;min-height:52px;" onclick="app.reopen()">Reopen the day</button>`:""}`;
    else if(confirmClose) action=`<div class="warn">Close the day? Sales can't be changed after this.${unpaid?` ${unpaid} sale${unpaid===1?" is":"s are"} not paid yet.`:""}</div>
      <div class="paid-row"><button class="big" onclick="app.armClose(false)">No</button><button class="big main" style="min-height:58px;font-size:1.25rem;" onclick="app.closeDay()">Yes, close</button></div>`;
    else action=`<button class="big main col" onclick="app.armClose(true)">Close the day<span class="sub">and download the Excel for the printer</span></button>`;
    return `<div class="step">${dayDate===todayStr()?"Today":"Day"}</div><h1>${esc(fmtDate(dayDate))}</h1>
      <div class="figs"><div class="fig"><b class="tnum">${shirts}</b><span>Shirts</span></div><div class="fig"><b class="tnum">${money(sales)}</b><span>Sales</span></div><div class="fig"><b class="tnum">${money(cash)}</b><span>Paid</span></div></div>
      ${action}
      <div class="card" style="margin-top:4px;">
        ${list.length?list.map(o=>{ const locked=!!closing(o.date,o.branchId); return `<div class="sale">
          <span class="i"><span class="n">${esc(o.playerName)}</span> <span class="muted">#${esc(o.number)} ${esc(o.nickname)}</span><br><span class="d">${esc(itemsText(o.items))}${isAdmin()?" · "+esc(branchName(o.branchId)):""} · ${esc(fmtTime(o.createdAt))}</span></span>
          ${locked?`<span class="pill ${o.paid?"y":"n"}">${o.paid?"Paid":"Not paid"}</span>`:`<button class="pill ${o.paid?"y":"n"}" onclick="app.flipPaid('${o.id}')">${o.paid?"Paid":"Not paid"}</button>`}
          ${locked?"":confirmDel===o.id?`<button class="pill n" onclick="app.del('${o.id}')">Delete?</button>`:`<button class="x" onclick="app.armDel('${o.id}')" aria-label="Delete sale">✕</button>`}
        </div>`; }).join(""):`<p class="muted" style="margin:0;">No sales on this day.</p>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">${back("home")}<input class="date" type="date" id="f-date" value="${esc(dayDate)}" max="${todayStr()}" onchange="app.setDay(this.value)" aria-label="Pick another day"></div>`; }
  function setDay(v){ if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ dayDate=v; to("day"); } }
  function armClose(v){ confirmClose=v; render(); }
  function armDel(id){ confirmDel=id; render(); }
  function del(id){ const o=uni.orders.find(o=>o.id===id); if(!o||closing(o.date,o.branchId))return; uni.orders=uni.orders.filter(x=>x.id!==id); wRemove("orders/"+id); confirmDel=null; toast("Sale deleted"); render(); }
  function flipPaid(id){ const o=uni.orders.find(o=>o.id===id); if(!o||closing(o.date,o.branchId))return; o.paid=!o.paid; wSet("orders/"+id+"/paid",o.paid); render(); }
  function closeDay(){ const u={}, now=Date.now();
    scopeIds().filter(b=>!closing(dayDate,b)).forEach(b=>{ const os=uni.orders.filter(o=>o.date===dayDate&&o.branchId===b);
      const c={ closedAt:now, by:isAdmin()?"Admin":branchName(b), orders:os.length, shirts:os.reduce((s,o)=>s+pieces(o),0), sales:os.reduce((s,o)=>s+orderTotal(o),0), paid:os.filter(o=>o.paid).reduce((s,o)=>s+orderTotal(o),0) };
      if(!uni.closings[dayDate])uni.closings[dayDate]={}; uni.closings[dayDate][b]=c; u[`closings/${dayDate}/${b}`]=c; });
    if(Object.keys(u).length)wMulti(u);
    confirmClose=false; toast("Day closed ✓"); download(); render(); }
  function reopen(){ if(!isAdmin())return; const u={};
    scopeIds().forEach(b=>{ if(closing(dayDate,b)){ delete uni.closings[dayDate][b]; u[`closings/${dayDate}/${b}`]=null; } });
    if(Object.keys(u).length)wMulti(u); toast("Day reopened"); render(); }

  // ===== Excel for the printing company =====
  function download(){
    const list=uni.orders.filter(o=>o.date===dayDate&&inScope(o.branchId)); if(!list.length)return;
    if(typeof XLSX==="undefined"){ toast("Excel tool didn't load — check your internet and reload"); return; }
    // One row per shirt line, sorted color → size so the printer can work straight down the list.
    const rows=[]; list.forEach(o=>o.items.forEach(i=>rows.push({o,i})));
    rows.sort((a,b)=>COLORS.findIndex(c=>c.id===a.i.color)-COLORS.findIndex(c=>c.id===b.i.color)||SIZES.indexOf(a.i.size)-SIZES.indexOf(b.i.size)||branchName(a.o.branchId).localeCompare(branchName(b.o.branchId))||a.o.playerName.localeCompare(b.o.playerName));
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(rows.map(({o,i})=>({ "Color":colorLabel(i.color), "Size":i.size, "Qty":i.qty, "Number":o.number, "Name on back":o.nickname, "Player":o.playerName, "Team":o.teamName, "Branch":branchName(o.branchId) })));
    ws["!cols"]=[{wch:8},{wch:6},{wch:5},{wch:8},{wch:16},{wch:26},{wch:14},{wch:18}]; ws["!autofilter"]={ref:ws["!ref"]};
    XLSX.utils.book_append_sheet(wb,ws,"Shirts to print");
    const m={}; list.forEach(o=>o.items.forEach(i=>{ m[i.color]=m[i.color]||{}; m[i.color][i.size]=(m[i.color][i.size]||0)+i.qty; }));
    const aoa=[[`BFA kit order — ${uni.settings.collection||""} — ${dayDate}`],[],["Color",...SIZES,"Total"]];
    COLORS.forEach(c=>{ const r=m[c.id]||{}; aoa.push([c.label,...SIZES.map(s=>r[s]||0),SIZES.reduce((t,s)=>t+(r[s]||0),0)]); });
    const colTot=SIZES.map(s=>COLORS.reduce((t,c)=>t+((m[c.id]||{})[s]||0),0)); aoa.push(["Total",...colTot,colTot.reduce((a,b)=>a+b,0)]);
    const ws2=XLSX.utils.aoa_to_sheet(aoa); ws2["!cols"]=[{wch:9},...SIZES.map(()=>({wch:6})),{wch:7}];
    XLSX.utils.book_append_sheet(wb,ws2,"Totals");
    const scope=isAdmin()?"All-branches":branchName(myBranch());
    XLSX.writeFile(wb,`BFA-kit_${dayDate}_${scope.replace(/[^\p{L}\p{N}]+/gu,"-")}.xlsx`); }

  // ===== Kit settings (admin) =====
  function openSettings(){ if(!isAdmin())return; const s=uni.settings;
    openModal(`<h1 style="font-size:1.8rem;margin:0;">Kit settings</h1>
      <p class="muted" style="margin:0;">When the new kit arrives (every 2 seasons), change the name. Old sales keep the old name.</p>
      <div class="field"><label class="label" for="k-name">Kit name</label><input id="k-name" style="font-size:1.3rem;" value="${esc(s.collection)}" placeholder="KIT 2026–2028"></div>
      <div class="field"><label class="label" for="k-price">Price per shirt ($)</label><input id="k-price" type="number" min="0" step="0.5" style="font-size:1.3rem;" value="${esc(s.price||"")}" placeholder="35"></div>
      <div class="err" id="k-err"></div>
      <div class="paid-row"><button class="big" onclick="app.closeModal()">Cancel</button><button class="big main" style="min-height:58px;font-size:1.25rem;" onclick="app.saveSettings()">Save</button></div>`); }
  function saveSettings(){ const name=document.getElementById("k-name").value.trim(), raw=document.getElementById("k-price").value, price=Number(raw);
    if(!name){ document.getElementById("k-err").textContent="Give the kit a name."; return; }
    if(raw===""||!(price>=0)){ document.getElementById("k-err").textContent="Type the price per shirt."; return; }
    uni.settings={collection:name,price}; wSet("settings",uni.settings); closeModal(); toast("Saved ✓"); render(); }

  function openModal(html){ document.getElementById("modal-body").innerHTML=html; document.getElementById("modal").classList.add("show"); }
  function closeModal(){ document.getElementById("modal").classList.remove("show"); }
  document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal")closeModal(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });
  function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.className="show"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.className="",2400); }

  window.app={ to, chooseRole, submitPin, newSale, setSearch, pickPlayer, checkNum, savePrint, pickColor:choose, pickSize, bump, setPaid, cancelSale, saveSale,
    openDay, setDay, armClose, armDel, del, flipPaid, closeDay, reopen, download, openSettings, saveSettings, closeModal };
</script>
</body>
</html>
