<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey — Beirut Football Academy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep:#0d1330; --navy:#1b2452; --red:#c8202e; --red-deep:#7d1019;
    --f-head:'Oswald','Arial Narrow',sans-serif;
    --f-body:'Public Sans',-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --brand-navy:#1b2452; --brand-red:#c8202e;
    --ink:#161c3f; --muted:#5b6178;
    --surface:#ffffff; --surface-2:#f5f6fb; --border:#e4e6f1;
    --present:#1f8a4c; --absent:#c8202e; --input:#ffffff;
    --shadow:0 10px 30px rgba(20,26,60,.10); --shadow-sm:0 3px 10px rgba(20,26,60,.07);
  }
  @media (prefers-color-scheme: dark){ :root{
    --brand-navy:#8092ec; --brand-red:#ff5663; --ink:#eef0fa; --muted:#9aa1c4;
    --surface:#141a35; --surface-2:#1a2142; --border:#2c3467;
    --present:#3fbf7a; --absent:#ff5663; --input:#10152c;
    --shadow:0 10px 34px rgba(0,0,0,.5); --shadow-sm:0 3px 12px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box;}
  html{min-height:100%;background:var(--navy-deep);
    background-image:radial-gradient(1200px 600px at 20% -10%, #26306a 0%, transparent 60%), linear-gradient(135deg,var(--navy-deep),#141c44 55%,var(--red-deep));
    background-attachment:fixed;background-repeat:no-repeat;}
  body{margin:0;font-family:var(--f-body);color:var(--ink);-webkit-font-smoothing:antialiased;
    min-height:100vh;padding:24px 16px 40px;background:transparent;}
  h1,h2,h3{margin:0;}
  input,select,button,textarea{font-family:inherit;}

  .wrap{width:100%;max-width:640px;margin:0 auto;}
  .sheet{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px 26px;}
  .crest{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .brand-logo{width:56px;height:56px;object-fit:contain;display:block;}
  .badge-shield{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--brand-navy),var(--brand-red));
    display:flex;align-items:center;justify-content:center;font-size:26px;}
  .kick{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.18em;font-size:.68rem;color:var(--brand-red);font-weight:600;}
  .club{font-family:var(--f-head);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:1.05rem;color:var(--brand-navy);}

  h1.s-title{font-family:var(--f-head);font-weight:700;text-transform:uppercase;letter-spacing:.02em;
    font-size:1.5rem;line-height:1.2;color:var(--ink);margin-bottom:8px;}
  p.s-intro{color:var(--muted);font-size:.92rem;line-height:1.55;margin:0 0 4px;white-space:pre-wrap;}
  .privacy{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;padding:11px 13px;margin:18px 0 4px;font-size:.8rem;color:var(--muted);line-height:1.45;}

  .q{border-top:1px solid var(--border);padding:20px 0 4px;}
  .q:first-of-type{border-top:none;}
  .q-label{font-family:var(--f-head);font-weight:600;font-size:.98rem;color:var(--ink);line-height:1.35;margin-bottom:3px;}
  .q-num{color:var(--brand-red);margin-right:7px;}
  .req{color:var(--brand-red);margin-left:4px;}
  .q-help{color:var(--muted);font-size:.82rem;margin:0 0 11px;white-space:pre-wrap;}
  .q-body{margin-top:11px;}

  input[type=text],input[type=number],input[type=date],textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
    background:var(--input);color:var(--ink);font-size:.95rem;}
  textarea{min-height:104px;resize:vertical;line-height:1.5;}
  input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,textarea:focus{
    outline:none;border-color:var(--brand-navy);}

  .opts{display:flex;flex-wrap:wrap;gap:9px;}
  .opts.stack{flex-direction:column;align-items:stretch;}
  .opt{position:relative;display:block;cursor:pointer;}
  .opt input{position:absolute;opacity:0;width:0;height:0;}
  .opt span{display:block;padding:11px 15px;border:1.5px solid var(--border);border-radius:12px;
    background:var(--surface);color:var(--ink);font-size:.92rem;transition:.12s;}
  .opt:hover span{border-color:var(--brand-navy);}
  .opt input:checked + span{border-color:var(--brand-navy);background:var(--brand-navy);color:#fff;font-weight:600;}
  .opt input:focus-visible + span{outline:2px solid var(--brand-red);outline-offset:2px;}
  .opts.rating .opt span{min-width:52px;text-align:center;font-family:var(--f-head);font-weight:600;font-size:1.02rem;}
  .rating-ends{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:.75rem;color:var(--muted);}

  .q-error{color:var(--brand-red);font-size:.8rem;margin-top:8px;min-height:0;font-weight:600;}
  .q.invalid .q-label{color:var(--brand-red);}

  .btn{border:1.5px solid var(--border);background:var(--surface);color:var(--ink);border-radius:12px;
    padding:12px 20px;font-family:var(--f-head);font-weight:600;text-transform:uppercase;letter-spacing:.03em;
    font-size:.8rem;cursor:pointer;}
  .btn-primary{background:var(--brand-red);border-color:var(--brand-red);color:#fff;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .submit-row{margin-top:26px;padding-top:22px;border-top:1px solid var(--border);}
  .submit-row .btn{width:100%;padding:15px;font-size:.9rem;}
  .form-error{color:var(--brand-red);font-size:.86rem;margin-top:12px;text-align:center;font-weight:600;}

  .state{text-align:center;padding:26px 6px 14px;}
  .state .big{font-size:44px;line-height:1;margin-bottom:14px;}
  .state h2{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.02em;font-size:1.25rem;color:var(--ink);margin-bottom:10px;}
  .state p{color:var(--muted);font-size:.92rem;line-height:1.55;margin:0 auto;max-width:400px;}
  .state .btn{margin-top:20px;}
  .foot{text-align:center;color:rgba(255,255,255,.6);font-size:.74rem;margin-top:18px;
    font-family:var(--f-head);text-transform:uppercase;letter-spacing:.12em;}
  .skel{color:var(--muted);text-align:center;padding:30px 0;font-family:var(--f-head);
    text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;}
</style>
</head>
<body>

<div class="wrap">
  <div class="sheet">
    <div class="crest">
      <img class="brand-logo" src="logo.png" alt="BFA" onerror="this.outerHTML='&lt;div class=&quot;badge-shield&quot;&gt;⚽&lt;/div&gt;'">
      <div>
        <div class="kick">Beirut Football Academy</div>
        <div class="club" id="head-club">Survey</div>
      </div>
    </div>
    <div id="content"><div class="skel">Loading…</div></div>
  </div>
  <div class="foot">Beirut Football Academy</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBGOrBYpLtl4fqb-JFJNHWZheQVkO9VpYA",
    authDomain: "bfa-sc-tracker.firebaseapp.com",
    databaseURL: "https://bfa-sc-tracker-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bfa-sc-tracker", storageBucket: "bfa-sc-tracker.firebasestorage.app",
    messagingSenderId: "337221107402", appId: "1:337221107402:web:90be943b8cfec13db03e33"
  };
  const db = getDatabase(initializeApp(firebaseConfig));
  const ROOT = "bfaTeamsState";          // survey definitions live with the app state
  const RESP_ROOT = "bfaSurveyResponses"; // answers live OUTSIDE it — see note below
  // This page only ever WRITES to RESP_ROOT. It never reads it, so nobody filling in
  // the survey (or holding the link) ever loads anyone else's answers. Reading them
  // happens only in the admin-only Surveys tab of teams.html.

  const content = document.getElementById("content");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const toArray = x => Array.isArray(x) ? x : (x && typeof x === "object" ? Object.values(x) : []);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const params = new URLSearchParams(location.search);
  const surveyId = (params.get("s") || location.hash.replace(/^#/, "")).trim();
  const doneKey = "bfaSurveyDone_" + surveyId;

  function state(icon, title, body, btn) {
    content.innerHTML = `<div class="state"><div class="big">${icon}</div><h2>${esc(title)}</h2><p>${body}</p>${btn || ""}</div>`;
  }

  if (!surveyId) {
    document.getElementById("head-club").textContent = "Survey";
    state("🔗", "Link is incomplete", "This survey link is missing its survey code. Please use the full link the academy sent you.");
  } else {
    load();
  }

  async function load() {
    let survey = null;
    try {
      const snap = await get(ref(db, ROOT + "/surveys/" + surveyId));
      survey = snap.val();
    } catch (e) {
      console.error(e);
      state("📡", "Can't connect", "We couldn't reach the academy right now. Check your internet connection and reload the page.");
      return;
    }
    if (!survey) {
      state("🔍", "Survey not found", "This link doesn't point to a survey any more. It may have been deleted — please check with the academy.");
      return;
    }
    document.title = (survey.title || "Survey") + " — Beirut Football Academy";
    if (survey.open === false) {
      document.getElementById("head-club").textContent = survey.title || "Survey";
      state("🔒", "This survey is closed", "Thanks for your interest — the academy is no longer collecting answers for this survey.");
      return;
    }
    if (localStorage.getItem(doneKey)) { alreadyDone(survey); return; }
    renderForm(survey);
  }

  function alreadyDone(survey) {
    document.getElementById("head-club").textContent = survey.title || "Survey";
    state("✅", "You've already answered",
      "Thanks — your answers were sent to the academy. If you need to send a different set of answers, you can fill it in again.",
      `<button class="btn" id="again-btn">Fill it in again</button>`);
    document.getElementById("again-btn").addEventListener("click", () => { localStorage.removeItem(doneKey); renderForm(survey); });
  }

  function questionsOf(survey) {
    return toArray(survey.questions)
      .filter(q => q && q.id && q.label)
      .sort((a, b) => (a.order || 0) - (b.order || 0));
  }

  function fieldHtml(q, i) {
    const name = "q_" + q.id;
    const opts = toArray(q.options).filter(o => String(o).trim() !== "");
    switch (q.type) {
      case "long":
        return `<textarea name="${name}" placeholder="Type your answer…"></textarea>`;
      case "number":
        return `<input type="number" name="${name}" step="any" placeholder="Type a number…">`;
      case "date":
        return `<input type="date" name="${name}">`;
      case "single":
        return `<div class="opts stack">${opts.map(o =>
          `<label class="opt"><input type="radio" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`;
      case "multi":
        return `<div class="opts stack">${opts.map(o =>
          `<label class="opt"><input type="checkbox" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`;
      case "yesno":
        return `<div class="opts">${["Yes", "No"].map(o =>
          `<label class="opt"><input type="radio" name="${name}" value="${o}"><span>${o}</span></label>`).join("")}</div>`;
      case "rating":
        return `<div class="opts rating">${[1, 2, 3, 4, 5].map(n =>
          `<label class="opt"><input type="radio" name="${name}" value="${n}"><span>${n}</span></label>`).join("")}</div>
          <div class="rating-ends"><span>1 — not at all</span><span>5 — very much</span></div>`;
      default:
        return `<input type="text" name="${name}" placeholder="Type your answer…">`;
    }
  }

  function renderForm(survey) {
    const qs = questionsOf(survey);
    document.getElementById("head-club").textContent = "Survey";
    let h = `<h1 class="s-title">${esc(survey.title || "Survey")}</h1>`;
    if (survey.intro) h += `<p class="s-intro">${esc(survey.intro)}</p>`;
    h += `<div class="privacy"><span>🔒</span><span>Your answers go straight to the academy and are only visible to the academy director. Nobody else filling in this survey can see them.</span></div>`;

    if (!qs.length) {
      h += `<div class="state"><div class="big">📝</div><h2>Not ready yet</h2><p>This survey doesn't have any questions yet. Please check back later.</p></div>`;
      content.innerHTML = h;
      return;
    }

    h += `<form id="survey-form" novalidate>`;
    qs.forEach((q, i) => {
      h += `<div class="q" id="qwrap_${esc(q.id)}">
        <div class="q-label"><span class="q-num">${i + 1}.</span>${esc(q.label)}${q.required ? '<span class="req">*</span>' : ""}</div>
        ${q.help ? `<p class="q-help">${esc(q.help)}</p>` : ""}
        <div class="q-body">${fieldHtml(q, i)}</div>
        <div class="q-error" id="qerr_${esc(q.id)}"></div>
      </div>`;
    });
    h += `<div class="submit-row">
      <button type="submit" class="btn btn-primary" id="submit-btn">Send my answers</button>
      <div class="form-error" id="form-error"></div>
    </div></form>`;
    content.innerHTML = h;
    const form = document.getElementById("survey-form");
    form.addEventListener("submit", e => { e.preventDefault(); submit(survey, qs); });
    // Drop the "needs an answer" warning the moment the question is answered — leaving it
    // up while the field is filled in reads as though the answer didn't take.
    const clearError = e => {
      const wrap = e.target.closest(".q");
      if (!wrap || !wrap.classList.contains("invalid")) return;
      wrap.classList.remove("invalid");
      const err = wrap.querySelector(".q-error");
      if (err) err.textContent = "";
      if (!form.querySelector(".q.invalid")) document.getElementById("form-error").textContent = "";
    };
    form.addEventListener("input", clearError);
    form.addEventListener("change", clearError);
  }

  function readAnswer(q) {
    const sel = `[name="q_${q.id}"]`;
    if (q.type === "multi") return [...document.querySelectorAll(sel + ":checked")].map(i => i.value);
    if (q.type === "single" || q.type === "yesno" || q.type === "rating") {
      const el = document.querySelector(sel + ":checked");
      if (!el) return "";
      return q.type === "rating" ? Number(el.value) : el.value;
    }
    const el = document.querySelector(sel);
    if (!el) return "";
    if (q.type === "number") return el.value.trim() === "" ? "" : Number(el.value);
    return el.value.trim();
  }

  function isBlank(v) { return v === "" || v == null || (Array.isArray(v) && !v.length) || (typeof v === "number" && Number.isNaN(v)); }

  async function submit(survey, qs) {
    const btn = document.getElementById("submit-btn");
    const formErr = document.getElementById("form-error");
    formErr.textContent = "";
    qs.forEach(q => {
      document.getElementById("qerr_" + q.id).textContent = "";
      document.getElementById("qwrap_" + q.id).classList.remove("invalid");
    });

    const answers = {};
    let firstBad = null;
    qs.forEach(q => {
      const v = readAnswer(q);
      if (q.required && isBlank(v)) {
        document.getElementById("qerr_" + q.id).textContent = "This question needs an answer.";
        document.getElementById("qwrap_" + q.id).classList.add("invalid");
        if (!firstBad) firstBad = q.id;
        return;
      }
      if (!isBlank(v)) answers[q.id] = { q: q.label, t: q.type || "short", v };
    });
    if (firstBad) {
      formErr.textContent = "Please answer the highlighted question(s).";
      document.getElementById("qwrap_" + firstBad).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (!Object.keys(answers).length) { formErr.textContent = "Please answer at least one question before sending."; return; }

    btn.disabled = true;
    btn.textContent = "Sending…";
    const rid = uid();
    try {
      await set(ref(db, RESP_ROOT + "/" + surveyId + "/" + rid), { id: rid, at: new Date().toISOString(), answers });
    } catch (e) {
      console.error(e);
      btn.disabled = false;
      btn.textContent = "Send my answers";
      formErr.textContent = "Couldn't send your answers. Check your connection and try again.";
      return;
    }
    try { localStorage.setItem(doneKey, "1"); } catch (e) { /* private mode — fine */ }
    document.title = "Thank you — Beirut Football Academy";
    state("⚽", "Thank you!", "Your answers have been sent to the academy. You can close this page now.");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
</script>
</body>
</html>
